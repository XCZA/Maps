<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My Custom Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        #fileInput { display: none; }

        /* ── Custom toolbar buttons ── */
        .custom-map-btn {
            font-size: 15px !important;
            line-height: 26px !important;
            display: block;
            text-align: center;
            text-decoration: none !important;
            cursor: pointer;
        }
        .custom-map-btn.layer-active { background: #e8f0fe !important; }

        /* ── Generic slide-out flyout panel ── */
        .flyout-panel {
            position: fixed;
            display: none;
            flex-direction: row;
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-left: none;
            border-radius: 0 4px 4px 0;
            box-shadow: 2px 1px 5px rgba(0,0,0,0.25);
            z-index: 1500;
            overflow: hidden;
        }
        .flyout-panel.open { display: flex; }
        .flyout-action-btn {
            display: block; padding: 0 16px;
            font-size: 12px; font-weight: 600; color: #555;
            cursor: pointer; text-decoration: none; white-space: nowrap;
            border-right: 1px solid #ddd; transition: background 0.1s;
        }
        .flyout-action-btn:last-child { border-right: none; }
        .flyout-action-btn:hover { background: #f4f4f4; color: #222; }
        .flyout-action-btn.active-layer { color: #1565C0; background: #e8f0fe; }

        /* ── Pin layer overlay panel (vertical, wider) ── */
        #pinLayerPanel {
            position: fixed;
            display: none;
            flex-direction: column;
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-left: none;
            border-radius: 0 6px 6px 0;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            z-index: 1500;
            min-width: 180px;
            padding: 6px 0;
        }
        #pinLayerPanel.open { display: flex; }
        #pinLayerPanel .panel-header {
            font-size: 10px; font-weight: 700; color: #999;
            letter-spacing: 0.08em; text-transform: uppercase;
            padding: 4px 14px 6px; border-bottom: 1px solid #eee; margin-bottom: 2px;
        }
        .pin-layer-row {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 14px; cursor: pointer;
            transition: background 0.1s;
        }
        .pin-layer-row:hover { background: #f4f4f4; }
        .pin-layer-toggle {
            width: 16px; height: 16px; border-radius: 3px;
            border: 2px solid #bbb; background: white;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background 0.15s, border-color 0.15s;
        }
        .pin-layer-toggle.on { background: #4285F4; border-color: #4285F4; }
        .pin-layer-toggle.on::after { content: '✓'; color: white; font-size: 10px; line-height: 1; }
        .pin-layer-label {
            font-size: 13px; font-weight: 600; color: #444;
        }
        .pin-layer-count {
            margin-left: auto; font-size: 11px; color: #aaa; font-weight: 400;
        }
        .pin-layer-loading { font-size: 11px; color: #aaa; margin-left: auto; }

        /* ── Toast ── */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 8px 18px; border-radius: 20px;
            font-size: 13px; z-index: 3000; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; white-space: nowrap;
        }
        #toast.show { opacity: 1; }

        /* ── Edit modal ── */
        #modalOverlay {
            display: none; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 2000;
            align-items: center; justify-content: center; padding: 16px;
        }
        #modalOverlay.active { display: flex; }
        #editBox {
            background: white; border-radius: 10px; padding: 24px;
            width: 100%; max-width: 360px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        #editBox h3 { margin: 0 0 16px; font-size: 16px; color: #333; }
        #editBox label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
        #editBox input[type="text"], #editBox textarea {
            width: 100%; border: 1px solid #ccc; border-radius: 6px;
            padding: 8px; font-size: 14px; margin-bottom: 14px; font-family: Arial, sans-serif;
        }
        #editBox textarea { resize: vertical; font-family: monospace; font-size: 13px; }
        .color-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .color-swatch {
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: transform 0.1s;
        }
        .color-swatch:hover { transform: scale(1.15); }
        .color-swatch.selected { border-color: #333 !important; transform: scale(1.15); }
        .tab-row { display: flex; margin-bottom: 6px; border-bottom: 1px solid #ddd; }
        .tab-btn {
            font-size: 12px; padding: 4px 12px; border: none; background: none;
            cursor: pointer; color: #999; border-bottom: 2px solid transparent; margin-bottom: -1px;
        }
        .tab-btn.active { color: #4285F4; border-bottom-color: #4285F4; font-weight: bold; }
        #descPreview {
            display: none; min-height: 80px; max-height: 200px; overflow-y: auto;
            border: 1px solid #ccc; border-radius: 6px; padding: 8px 10px;
            font-size: 13px; line-height: 1.5; color: #333; margin-bottom: 14px;
        }
        #descPreview p { margin: 0 0 6px; }
        #descPreview ul, #descPreview ol { margin: 4px 0; padding-left: 18px; }
        #descPreview code { background: #f0f0f0; border-radius: 3px; padding: 1px 4px; font-size: 12px; }
        .btn-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
        .btn-cancel {
            padding: 8px 16px; border: 1px solid #ccc;
            background: white; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .btn-save {
            padding: 8px 16px; border: none;
            background: #4285F4; color: white; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .btn-save:hover { background: #3367d6; }

        /* ── Popup ── */
        .leaflet-popup-content ul  { margin: 4px 0; padding-left: 16px; }
        .leaflet-popup-content code { background: #f0f0f0; border-radius: 3px; padding: 1px 3px; font-size: 12px; }
        .popup-edit-hint { font-size: 11px; color: #aaa; margin-top: 6px; border-top: 1px solid #eee; padding-top: 5px; }
        .popup-edit-btn {
            display: inline-block; margin-top: 8px; padding: 5px 14px;
            background: #4285F4; color: white; border: none; border-radius: 4px;
            cursor: pointer; font-size: 12px; font-family: Arial, sans-serif; -webkit-appearance: none;
        }
        .popup-edit-btn:active { background: #3367d6; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".json" onchange="loadMap(event)">

<!-- Base layer switcher flyout -->
<div id="layerActionsPanel" class="flyout-panel">
    <a class="flyout-action-btn active-layer" data-layer="regional" onclick="switchLayer('regional')">Regional</a>
    <a class="flyout-action-btn"              data-layer="atlas"    onclick="switchLayer('atlas')">Atlas</a>
    <a class="flyout-action-btn"              data-layer="terrain"  onclick="switchLayer('terrain')">Terrain</a>
</div>

<!-- Save / Load flyout -->
<div id="saveLoadPanel" class="flyout-panel">
    <a class="flyout-action-btn" onclick="saveMap(); closeSaveLoadPanel();">💾 Save</a>
    <a class="flyout-action-btn" onclick="closeSaveLoadPanel(); document.getElementById('fileInput').click();">📂 Load</a>
</div>

<!-- Pin layer overlay panel (vertical) -->
<div id="pinLayerPanel">
    <div class="panel-header">Pin Layers</div>
    <!-- rows injected by JS -->
</div>

<div id="modalOverlay">
    <div id="editBox">
        <h3>Edit Pin</h3>
        <label>Name</label>
        <input type="text" id="pinName" placeholder="Enter a name...">
        <label>Pin color</label>
        <div class="color-row" id="colorSwatches"></div>
        <label>Description
            <span style="font-size:11px;color:#bbb;margin-left:6px;">supports **markdown**</span>
        </label>
        <div class="tab-row">
            <button class="tab-btn active" id="tabWrite"   onclick="switchTab('write')">Write</button>
            <button class="tab-btn"        id="tabPreview" onclick="switchTab('preview')">Preview</button>
        </div>
        <textarea id="pinDesc" rows="5" placeholder="**bold**, *italic*, - lists, [links](url)..."></textarea>
        <div id="descPreview"></div>
        <div class="btn-row">
            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
            <button class="btn-save"   onclick="saveEdit()">Save</button>
        </div>
    </div>
</div>

<script>
// ─────────────────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────────────────
var LAYER_URLS = {
    regional: 'forgotten-realms-lighter.png',
    atlas:    'atlas.png',
    terrain:  'terrain.png'
};
var imageBounds = [[0, 0], [2797, 4063]];

// Predefined pin layer overlays (fetched from repo root)
var PIN_LAYER_DEFS = [
    { id: 'mythallars', label: 'Mythallars', file: 'Mythallars.json' },
    { id: 'mythals',    label: 'Mythals',    file: 'Mythals.json'    }
];

// ─────────────────────────────────────────────────────────
//  MAP INIT
// ─────────────────────────────────────────────────────────
var map = L.map('map', {
    crs:               L.CRS.Simple,
    minZoom:           -5,
    maxZoom:            5,
    zoomSnap:           0.5,
    closePopupOnClick: false
});

var imageOverlay = L.imageOverlay(LAYER_URLS.regional, imageBounds).addTo(map);
map.fitBounds(imageBounds);

var drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

var drawControl = new L.Control.Draw({
    draw:  { marker:true, polyline:true, polygon:true, rectangle:true, circle:false, circlemarker:false },
    edit:  { featureGroup: drawnItems, remove: true }
});
map.addControl(drawControl);

// ─────────────────────────────────────────────────────────
//  DEVICE DETECTION
// ─────────────────────────────────────────────────────────
var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

// ─────────────────────────────────────────────────────────
//  COLORS
// ─────────────────────────────────────────────────────────
var PIN_COLORS = [
    { name:'Red',    hex:'#e53935' }, { name:'Orange', hex:'#F57C00' },
    { name:'Yellow', hex:'#F9A825' }, { name:'Green',  hex:'#2E7D32' },
    { name:'Teal',   hex:'#00796B' }, { name:'Blue',   hex:'#1565C0' },
    { name:'Purple', hex:'#6A1B9A' }, { name:'Pink',   hex:'#AD1457' },
    { name:'White',  hex:'#f5f5f5' }, { name:'Black',  hex:'#212121' },
];
var selectedColor = PIN_COLORS[0].hex;

function makePinSVG(color) {
    var stroke = (color === '#f5f5f5') ? '#aaa' : 'rgba(0,0,0,0.3)';
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="36" viewBox="0 0 24 36">'
        + '<path d="M12 0C5.373 0 0 5.373 0 12c0 9 12 24 12 24S24 21 24 12C24 5.373 18.627 0 12 0z"'
        + ' fill="' + color + '" stroke="' + stroke + '" stroke-width="1.5"/>'
        + '<circle cx="12" cy="12" r="4.5" fill="rgba(255,255,255,0.35)"/>'
        + '</svg>'
    );
}
function makeIcon(color) {
    return L.icon({ iconUrl:makePinSVG(color), iconSize:[24,36], iconAnchor:[12,36], popupAnchor:[0,-38] });
}

var swatchContainer = document.getElementById('colorSwatches');
PIN_COLORS.forEach(function(c) {
    var sw = document.createElement('div');
    sw.className = 'color-swatch' + (c.hex === selectedColor ? ' selected' : '');
    sw.style.background = c.hex;
    if (c.hex === '#f5f5f5') sw.style.border = '3px solid #ccc';
    sw.title = c.name; sw.dataset.hex = c.hex;
    sw.onclick = function() { setSwatchSelection(c.hex); };
    swatchContainer.appendChild(sw);
});
function setSwatchSelection(hex) {
    selectedColor = hex;
    document.querySelectorAll('.color-swatch').forEach(function(s) {
        s.classList.remove('selected');
        s.style.border = (s.dataset.hex === '#f5f5f5') ? '3px solid #ccc' : '3px solid transparent';
    });
    var t = swatchContainer.querySelector('[data-hex="' + hex + '"]');
    if (t) { t.classList.add('selected'); t.style.border = '3px solid #333'; }
}

// ─────────────────────────────────────────────────────────
//  POPUP OPTIONS
// ─────────────────────────────────────────────────────────
var POPUP_OPTIONS_DESKTOP = {
    autoPan: true,
    autoPanPaddingTopLeft:     L.point(10, 90),
    autoPanPaddingBottomRight: L.point(10, 20),
    maxWidth:  260,
    maxHeight: 220
};
var POPUP_OPTIONS_MOBILE = {
    autoPan:   false,
    maxWidth:  260,
    maxHeight: 300
};
function popupOpts() {
    return isTouchDevice ? POPUP_OPTIONS_MOBILE : POPUP_OPTIONS_DESKTOP;
}

var lastOpenedLayer = null;

function buildPopupHtml(name, desc, readOnly) {
    var html = '<div style="max-width:230px;">'
        + '<b style="font-size:14px;">' + (name || 'Unnamed Pin') + '</b>';
    if (desc) {
        html += '<hr style="margin:6px 0;border:none;border-top:1px solid #ddd;">'
            +   '<div style="font-size:13px;line-height:1.5;">' + marked.parse(desc) + '</div>';
    }
    if (!readOnly) {
        if (isTouchDevice) {
            html += '<div style="margin-top:8px;border-top:1px solid #eee;padding-top:6px;">'
                +   '<button class="popup-edit-btn" onclick="editFromPopup()">✏️ Edit Pin</button>'
                +   '</div>';
        } else {
            html += '<div class="popup-edit-hint">Click pin to edit</div>';
        }
    } else {
        html += '<div class="popup-edit-hint" style="color:#bbb;">Read-only layer</div>';
    }
    html += '</div>';
    return html;
}

function editFromPopup() {
    if (lastOpenedLayer) {
        lastOpenedLayer.closePopup();
        showModal(lastOpenedLayer);
    }
}

// ─────────────────────────────────────────────────────────
//  TABS
// ─────────────────────────────────────────────────────────
function switchTab(tab) {
    if (tab === 'preview') {
        document.getElementById('descPreview').innerHTML =
            marked.parse(document.getElementById('pinDesc').value || '*Nothing written yet.*');
        document.getElementById('descPreview').style.display = 'block';
        document.getElementById('pinDesc').style.display     = 'none';
        document.getElementById('tabWrite').classList.remove('active');
        document.getElementById('tabPreview').classList.add('active');
    } else {
        document.getElementById('descPreview').style.display = 'none';
        document.getElementById('pinDesc').style.display     = 'block';
        document.getElementById('tabWrite').classList.add('active');
        document.getElementById('tabPreview').classList.remove('active');
    }
}

// ─────────────────────────────────────────────────────────
//  MODAL
// ─────────────────────────────────────────────────────────
var currentLayer = null;
function showModal(layer) {
    if (layer.isPopupOpen()) layer.closePopup();
    currentLayer = layer;
    document.getElementById('pinName').value = layer._customName || '';
    document.getElementById('pinDesc').value = layer._customDesc || '';
    setSwatchSelection(layer._customColor || PIN_COLORS[0].hex);
    switchTab('write');
    document.getElementById('modalOverlay').classList.add('active');
    setTimeout(function() { document.getElementById('pinName').focus(); }, 50);
}
function saveEdit() {
    if (!currentLayer) return;
    var name  = document.getElementById('pinName').value.trim();
    var desc  = document.getElementById('pinDesc').value.trim();
    var color = selectedColor;
    currentLayer._customName  = name;
    currentLayer._customDesc  = desc;
    currentLayer._customColor = color;
    if (currentLayer.setIcon) currentLayer.setIcon(makeIcon(color));
    var html = buildPopupHtml(name, desc, false);
    if (!currentLayer.getPopup()) { currentLayer.bindPopup(html, popupOpts()); }
    else                          { currentLayer.setPopupContent(html); }
    cancelEdit();
    showToast('Pin saved!');
}
function cancelEdit() {
    currentLayer = null;
    document.getElementById('modalOverlay').classList.remove('active');
}
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) cancelEdit();
});
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') cancelEdit(); });

// ─────────────────────────────────────────────────────────
//  ATTACH EVENTS
// ─────────────────────────────────────────────────────────
var hoverTimer = null;

function attachEvents(layer, readOnly) {
    if (!(layer instanceof L.Marker)) return;

    layer.on('popupopen', function(evt) {
        lastOpenedLayer = layer;
        clearTimeout(hoverTimer);
        if (!isTouchDevice) {
            var popupEl = evt.popup.getElement();
            if (popupEl) {
                if (popupEl._hoverEnter) popupEl.removeEventListener('mouseenter', popupEl._hoverEnter);
                if (popupEl._hoverLeave) popupEl.removeEventListener('mouseleave', popupEl._hoverLeave);
                popupEl._hoverEnter = function() { clearTimeout(hoverTimer); };
                popupEl._hoverLeave = function() {
                    hoverTimer = setTimeout(function() { layer.closePopup(); }, 200);
                };
                popupEl.addEventListener('mouseenter', popupEl._hoverEnter);
                popupEl.addEventListener('mouseleave', popupEl._hoverLeave);
            }
        }
    });

    layer.on('popupclose', function() { clearTimeout(hoverTimer); });

    if (!isTouchDevice) {
        layer.on('mouseover', function() {
            if (document.getElementById('modalOverlay').classList.contains('active')) return;
            clearTimeout(hoverTimer);
            layer.openPopup();
        });
        layer.on('mouseout', function() {
            hoverTimer = setTimeout(function() { layer.closePopup(); }, 200);
        });
        if (!readOnly) {
            layer.on('click', function(e) {
                L.DomEvent.stopPropagation(e);
                clearTimeout(hoverTimer);
                showModal(layer);
            });
        }
    } else {
        function bindNativeTouch() {
            var el = layer.getElement();
            if (!el) return;
            if (el._mTouchStart) el.removeEventListener('touchstart', el._mTouchStart);
            if (el._mTouchEnd)   el.removeEventListener('touchend',   el._mTouchEnd);
            var tapStartX, tapStartY;
            el._mTouchStart = function(e) {
                if (e.touches.length === 1) {
                    tapStartX = e.touches[0].clientX;
                    tapStartY = e.touches[0].clientY;
                }
            };
            el._mTouchEnd = function(e) {
                if (e.changedTouches.length !== 1) return;
                var dx = Math.abs(e.changedTouches[0].clientX - tapStartX);
                var dy = Math.abs(e.changedTouches[0].clientY - tapStartY);
                if (dx > 10 || dy > 10) return;
                e.preventDefault();
                e.stopPropagation();
                if (layer.isPopupOpen()) {
                    layer.closePopup();
                } else {
                    layer.openPopup();
                }
            };
            el.addEventListener('touchstart', el._mTouchStart, { passive: true });
            el.addEventListener('touchend',   el._mTouchEnd,   { passive: false });
        }
        if (layer.getElement()) { bindNativeTouch(); }
        else { layer.once('add', bindNativeTouch); }
    }
}

// ─────────────────────────────────────────────────────────
//  MOBILE BACKGROUND TAP → close open popup
// ─────────────────────────────────────────────────────────
if (isTouchDevice) {
    map.getContainer().addEventListener('touchend', function(e) {
        if (lastOpenedLayer && lastOpenedLayer.isPopupOpen()) {
            if (!map.dragging.moved()) {
                // If the finger lifted inside the open popup, the user was
                // scrolling or tapping popup content — don't close it.
                var popup = lastOpenedLayer.getPopup();
                var popupEl = popup && popup.getElement();
                if (popupEl && popupEl.contains(e.target)) return;
                lastOpenedLayer.closePopup();
            }
        }
    }, { passive: true });
}

// ─────────────────────────────────────────────────────────
//  DRAW
// ─────────────────────────────────────────────────────────
map.on(L.Draw.Event.CREATED, function(e) {
    var layer = e.layer;
    if (e.layerType === 'marker') {
        layer.setIcon(makeIcon(selectedColor));
        layer._customColor = selectedColor;
        layer.bindPopup(buildPopupHtml('', '', false), popupOpts());
    }
    drawnItems.addLayer(layer);
    attachEvents(layer, false);
    if (e.layerType === 'marker') showModal(layer);
});

// ─────────────────────────────────────────────────────────
//  BASE LAYER SWITCHER
// ─────────────────────────────────────────────────────────
var currentLayerName = 'regional';
var layerBtnRef = null;

function switchLayer(name) {
    closeLayerPanel();
    if (name === currentLayerName) return;
    imageOverlay.setUrl(LAYER_URLS[name]);
    currentLayerName = name;
    document.querySelectorAll('#layerActionsPanel .flyout-action-btn').forEach(function(b) {
        b.classList.toggle('active-layer', b.dataset.layer === name);
    });
    var label = name.charAt(0).toUpperCase() + name.slice(1);
    showToast('Switched to ' + label + ' view');
}
function openLayerPanel() {
    if (!layerBtnRef) return;
    var rect  = layerBtnRef.getBoundingClientRect();
    var panel = document.getElementById('layerActionsPanel');
    panel.style.top        = rect.top    + 'px';
    panel.style.left       = rect.right  + 'px';
    panel.style.height     = rect.height + 'px';
    panel.style.lineHeight = rect.height + 'px';
    panel.classList.add('open');
}
function closeLayerPanel() {
    document.getElementById('layerActionsPanel').classList.remove('open');
    if (layerBtnRef && layerBtnRef._role === 'layer') layerBtnRef.classList.remove('layer-active');
}

// ─────────────────────────────────────────────────────────
//  SAVE / LOAD FLYOUT
// ─────────────────────────────────────────────────────────
var saveBtnRef = null;

function openSaveLoadPanel(btn) {
    saveBtnRef = btn;
    var rect  = btn.getBoundingClientRect();
    var panel = document.getElementById('saveLoadPanel');
    panel.style.top        = rect.top    + 'px';
    panel.style.left       = rect.right  + 'px';
    panel.style.height     = rect.height + 'px';
    panel.style.lineHeight = rect.height + 'px';
    panel.classList.add('open');
    btn.classList.add('layer-active');
}
function closeSaveLoadPanel() {
    document.getElementById('saveLoadPanel').classList.remove('open');
    if (saveBtnRef) saveBtnRef.classList.remove('layer-active');
}

// ─────────────────────────────────────────────────────────
//  PIN LAYER OVERLAYS
// ─────────────────────────────────────────────────────────

// State for each overlay layer: { group, loaded, visible, count }
var pinLayerState = {};
PIN_LAYER_DEFS.forEach(function(def) {
    pinLayerState[def.id] = {
        group:   new L.FeatureGroup(),
        loaded:  false,
        visible: false,
        count:   0
    };
    map.addLayer(pinLayerState[def.id].group);
});

var pinLayerBtnRef = null;

function buildPinLayerPanel() {
    var panel = document.getElementById('pinLayerPanel');
    // Clear existing rows (keep header)
    var header = panel.querySelector('.panel-header');
    panel.innerHTML = '';
    panel.appendChild(header);

    PIN_LAYER_DEFS.forEach(function(def) {
        var state = pinLayerState[def.id];
        var row = document.createElement('div');
        row.className = 'pin-layer-row';
        row.id = 'pin-row-' + def.id;

        var toggle = document.createElement('div');
        toggle.className = 'pin-layer-toggle' + (state.visible ? ' on' : '');
        toggle.id = 'pin-toggle-' + def.id;

        var label = document.createElement('span');
        label.className = 'pin-layer-label';
        label.textContent = def.label;

        var count = document.createElement('span');
        count.className = 'pin-layer-count';
        count.id = 'pin-count-' + def.id;
        count.textContent = state.loaded ? state.count + ' pins' : '';

        row.appendChild(toggle);
        row.appendChild(label);
        row.appendChild(count);

        row.onclick = function() { togglePinLayer(def); };
        panel.appendChild(row);
    });
}

function openPinLayerPanel(btn) {
    pinLayerBtnRef = btn;
    buildPinLayerPanel();
    var rect  = btn.getBoundingClientRect();
    var panel = document.getElementById('pinLayerPanel');
    panel.style.top  = rect.top  + 'px';
    panel.style.left = rect.right + 'px';
    panel.classList.add('open');
    btn.classList.add('layer-active');
}
function closePinLayerPanel() {
    document.getElementById('pinLayerPanel').classList.remove('open');
    if (pinLayerBtnRef) pinLayerBtnRef.classList.remove('layer-active');
}

function togglePinLayer(def) {
    var state = pinLayerState[def.id];

    if (!state.loaded) {
        // Show loading state
        var countEl = document.getElementById('pin-count-' + def.id);
        if (countEl) { countEl.textContent = '…'; }

        fetch(def.file)
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(data) {
                data.forEach(function(item) {
                    if (item.type === 'marker') {
                        var color = item.color || PIN_COLORS[5].hex; // blue default for overlays
                        var layer = L.marker([item.lat, item.lng], { icon: makeIcon(color) });
                        layer._customName  = item.name  || '';
                        layer._customDesc  = item.desc  || '';
                        layer._customColor = color;
                        layer.bindPopup(buildPopupHtml(item.name, item.desc, true), popupOpts());
                        state.group.addLayer(layer);
                        attachEvents(layer, true);
                    }
                });
                state.loaded  = true;
                state.count   = state.group.getLayers().length;
                state.visible = true;
                updatePinLayerUI(def.id);
                showToast(def.label + ' loaded — ' + state.count + ' pins');
            })
            .catch(function(err) {
                console.error('Failed to load ' + def.file, err);
                var countEl = document.getElementById('pin-count-' + def.id);
                if (countEl) { countEl.textContent = 'not found'; }
                showToast('Could not load ' + def.label + '.json');
            });
    } else {
        // Toggle visibility
        state.visible = !state.visible;
        if (state.visible) {
            map.addLayer(state.group);
        } else {
            map.removeLayer(state.group);
        }
        updatePinLayerUI(def.id);
        showToast(def.label + ' ' + (state.visible ? 'shown' : 'hidden'));
    }
}

function updatePinLayerUI(id) {
    var state = pinLayerState[id];
    var toggle = document.getElementById('pin-toggle-' + id);
    var count  = document.getElementById('pin-count-' + id);
    if (toggle) { toggle.className = 'pin-layer-toggle' + (state.visible ? ' on' : ''); }
    if (count)  { count.textContent = state.loaded ? state.count + ' pins' : ''; }
}

// Close flyout panels when clicking elsewhere
document.addEventListener('click', function(e) {
    var layerPanel   = document.getElementById('layerActionsPanel');
    var savePanel    = document.getElementById('saveLoadPanel');
    var pinPanel     = document.getElementById('pinLayerPanel');

    if (layerPanel.classList.contains('open')) {
        if (!layerPanel.contains(e.target) && !(layerBtnRef && layerBtnRef.contains(e.target))) {
            closeLayerPanel();
        }
    }
    if (savePanel.classList.contains('open')) {
        if (!savePanel.contains(e.target) && !(saveBtnRef && saveBtnRef.contains(e.target))) {
            closeSaveLoadPanel();
        }
    }
    if (pinPanel.classList.contains('open')) {
        if (!pinPanel.contains(e.target) && !(pinLayerBtnRef && pinLayerBtnRef.contains(e.target))) {
            closePinLayerPanel();
        }
    }
});

// ─────────────────────────────────────────────────────────
//  CUSTOM TOOLBAR  (💾 📂 🌍)
// ─────────────────────────────────────────────────────────
var MapToolbarControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function() {
        var c = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        L.DomEvent.disableClickPropagation(c);
        L.DomEvent.disableScrollPropagation(c);

        function btn(icon, tip, fn) {
            var a = L.DomUtil.create('a', 'custom-map-btn', c);
            a.innerHTML = icon; a.href = '#'; a.title = tip;
            L.DomEvent.on(a, 'click', function(e) { L.DomEvent.preventDefault(e); fn(a); });
            return a;
        }

        // 💾 Save — now opens a flyout with Save / Load
        btn('💾', 'Save / Load', function(a) {
            var panel = document.getElementById('saveLoadPanel');
            if (panel.classList.contains('open')) { closeSaveLoadPanel(); }
            else {
                closeLayerPanel();
                closePinLayerPanel();
                openSaveLoadPanel(a);
            }
        });

        // 📂 Pin Layers — opens predefined overlay selector
        btn('📂', 'Pin Layers', function(a) {
            var panel = document.getElementById('pinLayerPanel');
            if (panel.classList.contains('open')) { closePinLayerPanel(); }
            else {
                closeLayerPanel();
                closeSaveLoadPanel();
                openPinLayerPanel(a);
            }
        });

        // 🌍 Base map switcher
        btn('🌍', 'Map Style', function(a) {
            a._role = 'layer';
            layerBtnRef = a;
            var panel = document.getElementById('layerActionsPanel');
            if (panel.classList.contains('open')) { closeLayerPanel(); }
            else {
                closeSaveLoadPanel();
                closePinLayerPanel();
                openLayerPanel();
            }
        });

        return c;
    }
});
new MapToolbarControl().addTo(map);

// ─────────────────────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────────────────────
var toastTimer;
function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ─────────────────────────────────────────────────────────
//  SAVE / LOAD (user pins)
// ─────────────────────────────────────────────────────────
function saveMap() {
    var data = [];
    drawnItems.eachLayer(function(layer) {
        if (layer instanceof L.Marker) {
            var ll = layer.getLatLng();
            data.push({ type:'marker', lat:ll.lat, lng:ll.lng,
                        name:layer._customName||'', desc:layer._customDesc||'',
                        color:layer._customColor||PIN_COLORS[0].hex });
        } else if (layer instanceof L.Polyline || layer instanceof L.Polygon || layer instanceof L.Rectangle) {
            data.push({ type:'shape', geojson:layer.toGeoJSON() });
        }
    });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    a.download = 'my-map-pins.json'; a.click();
    showToast('Map saved as my-map-pins.json!');
}
function loadMap(event) {
    var file = event.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            drawnItems.clearLayers();
            data.forEach(restoreItem);
            showToast('Map loaded — ' + data.length + ' items restored.');
        } catch(err) { showToast('Error loading file.'); console.error(err); }
    };
    reader.readAsText(file);
    event.target.value = '';
}
function restoreItem(item) {
    if (item.type === 'marker') {
        var color = item.color || PIN_COLORS[0].hex;
        var layer = L.marker([item.lat, item.lng], { icon: makeIcon(color) });
        layer._customName  = item.name  || '';
        layer._customDesc  = item.desc  || '';
        layer._customColor = color;
        layer.bindPopup(buildPopupHtml(item.name, item.desc, false), popupOpts());
        drawnItems.addLayer(layer);
        attachEvents(layer, false);
    } else if (item.type === 'shape' && item.geojson) {
        var s = L.geoJSON(item.geojson).getLayers()[0];
        if (s) drawnItems.addLayer(s);
    }
}

// Auto-load on startup
fetch('my-map-pins.json')
    .then(function(r)    { return r.json(); })
    .then(function(data) { drawnItems.clearLayers(); data.forEach(restoreItem); })
    .catch(function()    { /* no pins file yet */ });
</script>
