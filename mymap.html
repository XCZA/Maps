<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My Custom Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        #fileInput { display: none; }

        /* ── Custom toolbar button sizing ── */
        .custom-map-btn {
            font-size: 15px !important;
            line-height: 26px !important;
            display: block;
            text-align: center;
            text-decoration: none !important;
            cursor: pointer;
        }
        .custom-map-btn.layer-active {
            background: #e8f0fe !important;
        }

        /* ── Layer actions panel (slides out from 🌍 button, position:fixed) ── */
        #layerActionsPanel {
            position: fixed;
            display: none;
            flex-direction: row;
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-left: none;
            border-radius: 0 4px 4px 0;
            box-shadow: 2px 1px 5px rgba(0,0,0,0.25);
            z-index: 1500;
            overflow: hidden;
        }
        #layerActionsPanel.open { display: flex; }

        .layer-action-btn {
            display: block;
            padding: 0 16px;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            text-decoration: none;
            line-height: 26px;
            white-space: nowrap;
            border-right: 1px solid #ddd;
            transition: background 0.1s;
        }
        .layer-action-btn:last-child { border-right: none; }
        .layer-action-btn:hover { background: #f4f4f4; color: #222; }
        .layer-action-btn.active-layer { color: #1565C0; background: #e8f0fe; }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #333; color: white;
            padding: 8px 18px; border-radius: 20px;
            font-size: 13px; z-index: 3000;
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        #toast.show { opacity: 1; }

        /* ── Modal overlay ── */
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #modalOverlay.active { display: flex; }

        #editBox {
            background: white;
            border-radius: 10px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        #editBox h3 { margin: 0 0 16px; font-size: 16px; color: #333; }
        #editBox label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
        #editBox input[type="text"],
        #editBox textarea {
            width: 100%;
            border: 1px solid #ccc; border-radius: 6px;
            padding: 8px; font-size: 14px; margin-bottom: 14px;
            font-family: Arial, sans-serif;
        }
        #editBox textarea { resize: vertical; font-family: monospace; font-size: 13px; }

        .color-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .color-swatch {
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: transform 0.1s;
        }
        .color-swatch:hover { transform: scale(1.15); }
        .color-swatch.selected { border-color: #333 !important; transform: scale(1.15); }

        .tab-row { display: flex; margin-bottom: 6px; border-bottom: 1px solid #ddd; }
        .tab-btn {
            font-size: 12px; padding: 4px 12px; border: none; background: none;
            cursor: pointer; color: #999; border-bottom: 2px solid transparent; margin-bottom: -1px;
        }
        .tab-btn.active { color: #4285F4; border-bottom-color: #4285F4; font-weight: bold; }

        #descPreview {
            display: none; min-height: 80px; max-height: 200px; overflow-y: auto;
            border: 1px solid #ccc; border-radius: 6px; padding: 8px 10px;
            font-size: 13px; line-height: 1.5; color: #333; margin-bottom: 14px;
        }
        #descPreview p { margin: 0 0 6px; }
        #descPreview ul, #descPreview ol { margin: 4px 0; padding-left: 18px; }
        #descPreview code { background: #f0f0f0; border-radius: 3px; padding: 1px 4px; font-size: 12px; }

        .btn-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
        .btn-cancel {
            padding: 8px 16px; border: 1px solid #ccc;
            background: white; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .btn-save {
            padding: 8px 16px; border: none;
            background: #4285F4; color: white; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .btn-save:hover { background: #3367d6; }

        /* ── Popup styles ── */
        .leaflet-popup-content ul { margin: 4px 0; padding-left: 16px; }
        .leaflet-popup-content code { background: #f0f0f0; border-radius: 3px; padding: 1px 3px; font-size: 12px; }
        /* Force popup content to scroll from top */
        .leaflet-popup-scrolled { scroll-behavior: auto; }

        .popup-edit-hint {
            font-size: 11px; color: #aaa; margin-top: 6px;
            border-top: 1px solid #eee; padding-top: 5px;
        }
        /* Mobile-only edit button inside popup */
        .popup-edit-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 14px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: Arial, sans-serif;
            -webkit-appearance: none;
        }
        .popup-edit-btn:active { background: #3367d6; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="toast"></div>
<input type="file" id="fileInput" accept=".json" onchange="loadMap(event)">

<!-- Layer actions panel — injected to <body> so position:fixed works cleanly -->
<div id="layerActionsPanel">
    <a class="layer-action-btn active-layer" data-layer="regional"
       onclick="switchLayer('regional')">Regional</a>
    <a class="layer-action-btn" data-layer="atlas"
       onclick="switchLayer('atlas')">Atlas</a>
</div>

<!-- Edit modal -->
<div id="modalOverlay">
    <div id="editBox">
        <h3>Edit Pin</h3>

        <label>Name</label>
        <input type="text" id="pinName" placeholder="Enter a name...">

        <label>Pin color</label>
        <div class="color-row" id="colorSwatches"></div>

        <label>Description
            <span style="font-size:11px;color:#bbb;margin-left:6px;">supports **markdown**</span>
        </label>
        <div class="tab-row">
            <button class="tab-btn active" id="tabWrite"    onclick="switchTab('write')">Write</button>
            <button class="tab-btn"        id="tabPreview"  onclick="switchTab('preview')">Preview</button>
        </div>
        <textarea id="pinDesc" rows="5" placeholder="**bold**, *italic*, - lists, [links](url)..."></textarea>
        <div id="descPreview"></div>

        <div class="btn-row">
            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
            <button class="btn-save"   onclick="saveEdit()">Save</button>
        </div>
    </div>
</div>

<script>
// ════════════════════════════════════════════
//  MAP CONFIG  —  edit these two lines only
// ════════════════════════════════════════════
var LAYER_URLS = {
    regional: 'forgotten-realms-lighter.png',
    atlas:    'atlas.png'
};
var imageBounds = [[0, 0], [2797, 4063]];   // [height, width] of your image in pixels

// ════════════════════════════════════════════
//  MAP INIT
// ════════════════════════════════════════════
var map = L.map('map', {
    crs:      L.CRS.Simple,
    minZoom:  -5,
    maxZoom:   5,
    zoomSnap:  0.5,
    tap: false
});

var imageOverlay = L.imageOverlay(LAYER_URLS.regional, imageBounds).addTo(map);
map.fitBounds(imageBounds);

var drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

var drawControl = new L.Control.Draw({
    draw: {
        marker: true, polyline: true, polygon: true,
        rectangle: true, circle: false, circlemarker: false
    },
    edit: { featureGroup: drawnItems, remove: true }
});
map.addControl(drawControl);

// ════════════════════════════════════════════
//  DEVICE DETECTION
// ════════════════════════════════════════════
var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

// ════════════════════════════════════════════
//  COLORS
// ════════════════════════════════════════════
var PIN_COLORS = [
    { name: 'Red',    hex: '#e53935' },
    { name: 'Orange', hex: '#F57C00' },
    { name: 'Yellow', hex: '#F9A825' },
    { name: 'Green',  hex: '#2E7D32' },
    { name: 'Teal',   hex: '#00796B' },
    { name: 'Blue',   hex: '#1565C0' },
    { name: 'Purple', hex: '#6A1B9A' },
    { name: 'Pink',   hex: '#AD1457' },
    { name: 'White',  hex: '#f5f5f5' },
    { name: 'Black',  hex: '#212121' },
];
var selectedColor = PIN_COLORS[0].hex;

function makePinSVG(color) {
    var stroke = (color === '#f5f5f5') ? '#aaa' : 'rgba(0,0,0,0.3)';
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="36" viewBox="0 0 24 36">'
        + '<path d="M12 0C5.373 0 0 5.373 0 12c0 9 12 24 12 24S24 21 24 12C24 5.373 18.627 0 12 0z" '
        + 'fill="' + color + '" stroke="' + stroke + '" stroke-width="1.5"/>'
        + '<circle cx="12" cy="12" r="4.5" fill="rgba(255,255,255,0.35)"/>'
        + '</svg>'
    );
}

function makeIcon(color) {
    return L.icon({
        iconUrl:     makePinSVG(color),
        iconSize:    [24, 36],
        iconAnchor:  [12, 36],
        popupAnchor: [0, -38]
    });
}

// Build colour swatches in modal
var swatchContainer = document.getElementById('colorSwatches');
PIN_COLORS.forEach(function(c) {
    var sw = document.createElement('div');
    sw.className   = 'color-swatch' + (c.hex === selectedColor ? ' selected' : '');
    sw.style.background = c.hex;
    if (c.hex === '#f5f5f5') sw.style.border = '3px solid #ccc';
    sw.title       = c.name;
    sw.dataset.hex = c.hex;
    sw.onclick     = function() { setSwatchSelection(c.hex); };
    swatchContainer.appendChild(sw);
});

function setSwatchSelection(hex) {
    selectedColor = hex;
    document.querySelectorAll('.color-swatch').forEach(function(s) {
        s.classList.remove('selected');
        s.style.border = (s.dataset.hex === '#f5f5f5') ? '3px solid #ccc' : '3px solid transparent';
    });
    var target = swatchContainer.querySelector('[data-hex="' + hex + '"]');
    if (target) { target.classList.add('selected'); target.style.border = '3px solid #333'; }
}

// ════════════════════════════════════════════
//  POPUP
//  autoPan:true — Leaflet pans the map so the
//  full popup is always visible in the viewport.
//  maxHeight adds a scrollbar on tall content
//  and always starts scroll at top.
// ════════════════════════════════════════════
var POPUP_OPTIONS = {
    autoPan:                   true,
    autoPanPaddingTopLeft:     L.point(10, 90),   // extra room for toolbar at top-left
    autoPanPaddingBottomRight: L.point(10, 20),
    maxWidth:                  260,
    maxHeight:                 220                 // scroll if taller; starts at top
};

var lastOpenedLayer = null;   // used by editFromPopup() on mobile

function buildPopupHtml(name, desc) {
    var html = '<div style="max-width:230px;">'
        + '<b style="font-size:14px;">' + (name || 'Unnamed Pin') + '</b>';
    if (desc) {
        html += '<hr style="margin:6px 0;border:none;border-top:1px solid #ddd;">'
            +   '<div style="font-size:13px;line-height:1.5;">' + marked.parse(desc) + '</div>';
    }
    if (isTouchDevice) {
        // On touch: tap the popup to see content, then tap Edit Pin to open the modal
        html += '<div style="margin-top:8px;border-top:1px solid #eee;padding-top:6px;">'
            +   '<button class="popup-edit-btn" onclick="editFromPopup()">✏️ Edit Pin</button>'
            +   '</div>';
    } else {
        html += '<div class="popup-edit-hint">Click pin to edit</div>';
    }
    html += '</div>';
    return html;
}

// Called by the Edit Pin button inside a mobile popup
function editFromPopup() {
    if (lastOpenedLayer) {
        lastOpenedLayer.closePopup();
        showModal(lastOpenedLayer);
    }
}

// ════════════════════════════════════════════
//  TABS (in the edit modal)
// ════════════════════════════════════════════
function switchTab(tab) {
    if (tab === 'preview') {
        document.getElementById('descPreview').innerHTML =
            marked.parse(document.getElementById('pinDesc').value || '*Nothing written yet.*');
        document.getElementById('descPreview').style.display  = 'block';
        document.getElementById('pinDesc').style.display      = 'none';
        document.getElementById('tabWrite').classList.remove('active');
        document.getElementById('tabPreview').classList.add('active');
    } else {
        document.getElementById('descPreview').style.display  = 'none';
        document.getElementById('pinDesc').style.display      = 'block';
        document.getElementById('tabWrite').classList.add('active');
        document.getElementById('tabPreview').classList.remove('active');
    }
}

// ════════════════════════════════════════════
//  MODAL
// ════════════════════════════════════════════
var currentLayer = null;

function showModal(layer) {
    if (layer.isPopupOpen()) layer.closePopup();
    currentLayer = layer;
    document.getElementById('pinName').value = layer._customName || '';
    document.getElementById('pinDesc').value = layer._customDesc || '';
    setSwatchSelection(layer._customColor || PIN_COLORS[0].hex);
    switchTab('write');
    document.getElementById('modalOverlay').classList.add('active');
    setTimeout(function() { document.getElementById('pinName').focus(); }, 50);
}

function saveEdit() {
    if (!currentLayer) return;
    var name  = document.getElementById('pinName').value.trim();
    var desc  = document.getElementById('pinDesc').value.trim();
    var color = selectedColor;

    currentLayer._customName  = name;
    currentLayer._customDesc  = desc;
    currentLayer._customColor = color;

    if (currentLayer.setIcon) currentLayer.setIcon(makeIcon(color));

    var html = buildPopupHtml(name, desc);
    if (!currentLayer.getPopup()) {
        currentLayer.bindPopup(html, POPUP_OPTIONS);
    } else {
        currentLayer.setPopupContent(html);
    }

    cancelEdit();
    showToast('Pin saved!');
}

function cancelEdit() {
    currentLayer = null;
    document.getElementById('modalOverlay').classList.remove('active');
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) cancelEdit();
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') cancelEdit();
});

// ════════════════════════════════════════════
//  ATTACH EVENTS TO A MARKER LAYER
//  Desktop  : hover → popup,  click → modal
//  Touch    : tap   → popup with Edit button
// ════════════════════════════════════════════
function attachEvents(layer) {
    if (!(layer instanceof L.Marker)) return;

    layer.on('popupopen', function() {
        lastOpenedLayer = layer;
    });

    if (isTouchDevice) {
        // Single tap toggles popup; Edit button inside popup opens modal
        layer.on('click', function(e) {
            L.DomEvent.stopPropagation(e);
            L.DomEvent.preventDefault(e);
            
            setTimeout(() => {
                if (layer.isPopupOpen()) {
                    layer.closePopup();
                } else {
                    layer.openPopup();
                }
            }, 10);
        });
    } else {
        // Hover shows popup, click opens editor
        layer.on('mouseover', function() {
            if (document.getElementById('modalOverlay').classList.contains('active')) return;
            layer.openPopup();
        });
        layer.on('mouseout', function() {
            layer.closePopup();
        });
        layer.on('click', function(e) {
            L.DomEvent.stopPropagation(e);
            showModal(layer);
        });
    }
}

// ════════════════════════════════════════════
//  DRAW EVENT
// ════════════════════════════════════════════
map.on(L.Draw.Event.CREATED, function(e) {
    var layer = e.layer;
    if (e.layerType === 'marker') {
        layer.setIcon(makeIcon(selectedColor));
        layer._customColor = selectedColor;
        layer.bindPopup(buildPopupHtml('', ''), POPUP_OPTIONS);
    }
    drawnItems.addLayer(layer);
    attachEvents(layer);
    if (e.layerType === 'marker') showModal(layer);
});

// ════════════════════════════════════════════
//  LAYER SWITCHER
// ════════════════════════════════════════════
var currentLayerName = 'regional';
var layerBtnRef      = null;   // set when toolbar control is built

function switchLayer(name) {
    closeLayerPanel();
    if (name === currentLayerName) return;
    imageOverlay.setUrl(LAYER_URLS[name]);
    currentLayerName = name;
    document.querySelectorAll('.layer-action-btn').forEach(function(b) {
        b.classList.toggle('active-layer', b.dataset.layer === name);
    });
    showToast('Switched to ' + (name.charAt(0).toUpperCase() + name.slice(1)) + ' view');
}

function openLayerPanel() {
    if (!layerBtnRef) return;
    var rect  = layerBtnRef.getBoundingClientRect();
    var panel = document.getElementById('layerActionsPanel');
    // Align panel vertically with the 🌍 button, growing to the right
    panel.style.top    = rect.top    + 'px';
    panel.style.left   = rect.right  + 'px';
    // Match the button's exact height so the panel looks "connected"
    panel.style.height = rect.height + 'px';
    panel.style.lineHeight = rect.height + 'px';
    panel.classList.add('open');
}

function closeLayerPanel() {
    document.getElementById('layerActionsPanel').classList.remove('open');
    if (layerBtnRef) layerBtnRef.classList.remove('layer-active');
}

// Close panel when clicking anywhere else
document.addEventListener('click', function(e) {
    var panel = document.getElementById('layerActionsPanel');
    if (!panel.classList.contains('open')) return;
    if (panel.contains(e.target)) return;
    if (layerBtnRef && layerBtnRef.contains(e.target)) return;
    closeLayerPanel();
});

// ════════════════════════════════════════════
//  CUSTOM TOOLBAR CONTROL
//  Adds 💾  📂  🌍 to the Leaflet toolbar
// ════════════════════════════════════════════
var MapToolbarControl = L.Control.extend({
    options: { position: 'topleft' },

    onAdd: function(map) {
        var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        // 💾 Save
        var saveBtn = L.DomUtil.create('a', 'custom-map-btn', container);
        saveBtn.innerHTML = '💾';
        saveBtn.href      = '#';
        saveBtn.title     = 'Save Map';
        L.DomEvent.on(saveBtn, 'click', function(e) {
            L.DomEvent.preventDefault(e);
            saveMap();
        });

        // 📂 Load
        var loadBtn = L.DomUtil.create('a', 'custom-map-btn', container);
        loadBtn.innerHTML = '📂';
        loadBtn.href      = '#';
        loadBtn.title     = 'Load Map';
        L.DomEvent.on(loadBtn, 'click', function(e) {
            L.DomEvent.preventDefault(e);
            document.getElementById('fileInput').click();
        });

        // 🌍 Layer switcher
        var layerBtn = L.DomUtil.create('a', 'custom-map-btn', container);
        layerBtn.innerHTML = '🌍';
        layerBtn.href      = '#';
        layerBtn.title     = 'Text Layers';
        layerBtnRef = layerBtn;    // store reference for panel positioning

        L.DomEvent.on(layerBtn, 'click', function(e) {
            L.DomEvent.preventDefault(e);
            var panel = document.getElementById('layerActionsPanel');
            if (panel.classList.contains('open')) {
                closeLayerPanel();
            } else {
                layerBtn.classList.add('layer-active');
                openLayerPanel();
            }
        });

        return container;
    }
});
new MapToolbarControl().addTo(map);

// ════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════
var toastTimer;
function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ════════════════════════════════════════════
//  SAVE / LOAD
// ════════════════════════════════════════════
function saveMap() {
    var data = [];
    drawnItems.eachLayer(function(layer) {
        if (layer instanceof L.Marker) {
            var ll = layer.getLatLng();
            data.push({
                type:  'marker',
                lat:   ll.lat,
                lng:   ll.lng,
                name:  layer._customName  || '',
                desc:  layer._customDesc  || '',
                color: layer._customColor || PIN_COLORS[0].hex
            });
        } else if (layer instanceof L.Polyline ||
                   layer instanceof L.Polygon  ||
                   layer instanceof L.Rectangle) {
            data.push({ type: 'shape', geojson: layer.toGeoJSON() });
        }
    });

    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a    = document.createElement('a');
    a.href   = URL.createObjectURL(blob);
    a.download = 'my-map-pins.json';
    a.click();
    showToast('Map saved as my-map-pins.json!');
}

function loadMap(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            drawnItems.clearLayers();
            data.forEach(restoreItem);
            showToast('Map loaded — ' + data.length + ' items restored.');
        } catch(err) {
            showToast('Error loading file.');
            console.error(err);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function restoreItem(item) {
    var layer;
    if (item.type === 'marker') {
        var color = item.color || PIN_COLORS[0].hex;
        layer = L.marker([item.lat, item.lng], { icon: makeIcon(color) });
        layer._customName  = item.name  || '';
        layer._customDesc  = item.desc  || '';
        layer._customColor = color;
        layer.bindPopup(buildPopupHtml(item.name, item.desc), POPUP_OPTIONS);
        drawnItems.addLayer(layer);
        attachEvents(layer);
    } else if (item.type === 'shape' && item.geojson) {
        layer = L.geoJSON(item.geojson).getLayers()[0];
        if (layer) drawnItems.addLayer(layer);
    }
}

// Auto-load saved pins on page startup
fetch('my-map-pins.json')
    .then(function(r)    { return r.json(); })
    .then(function(data) {
        drawnItems.clearLayers();
